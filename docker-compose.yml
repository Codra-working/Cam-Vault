services:
  mysql:
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-recording_service}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - 3306:3306
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  storage:
    image: chrislusf/seaweedfs
    container_name: seaweedfs-s3
    ports:
      - 8333:8333
    entrypoint: /bin/sh -c
    volumes:
     - seaweed_data:/data

    command:
      - |
        mkdir -p /data/master /data/volumes

        echo '{
          "identities": [
            {
              "name": "anonymous",
              "actions": ["Read"]
            },
            {
              "name": "some_admin_user",
              "credentials": [
                {
                  "accessKey": "admin",
                  "secretKey": "secret"
                }
              ],
              "actions": ["Admin", "Read", "List", "Tagging", "Write"]
            }
          ]
        }' > /etc/seaweedfs/config.json

        exec weed server \
          -dir=/data/volumes \
          -master.dir=/data/master \
          -filer \
          -s3 \
          -s3.config=/etc/seaweedfs/config.json \
          -volume.max=0 \
          -volume.minFreeSpace=10GiB
    healthcheck:
      test: ["CMD-SHELL", "wget -S --spider http://127.0.0.1:8333 2>&1 | grep -q 'HTTP/'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
      
    restart: always

  storage-admin:
    image: chrislusf/seaweedfs
    command: admin -master=storage:9333 -port=23646 -dataDir=/data
    ports:
      - "23646:23646"
    volumes:
      - seaweed_admin_data:/data
    depends_on:
      storage:
        condition: service_healthy
    restart: always
  video-metadata-service:
    build:
      context: ./video-metadata-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SERVER_CONTEXT_PATH: /api/v1
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-test}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_TIMEZONE: Asia/Seoul
      JPA_DDL_AUTO: none
      TZ: Asia/Seoul
    depends_on:
      mysql:
        condition: service_healthy

  recording:
    build:
      context: ./recording
    restart: always
    command: sh -c "mkdir -p /app/storage/recordings /app/storage/recordings/encoded && node dist/main"
    ports:
      - 3001:3001
    environment:
      RECORDING_TCP_HOST: 0.0.0.0
      RECORDING_TCP_PORT: 3001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-recording_service}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-true}
      RABBITMQ_URL: amqp://rabbitmq:5672
      ENCODING_QUEUE: encoding_queue
      S3_ENDPOINT: http://storage:8333
      TARGET_DIR: /app/storage/recordings
      RECORDING_CRON: "${RECORDING_CRON:-* * * * *}"
      VIDEO_LENGTH: ${VIDEO_LENGTH:-30}
      TZ: Asia/Seoul
    volumes:
      - ./storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      storage:
        condition: service_healthy

  encoder:
    build:
      context: ./encoder
    restart: unless-stopped
    command: sh -c "mkdir -p /app/storage/recordings/encoded && node dist/main"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-test}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-false}
      RABBITMQ_URL: amqp://rabbitmq:5672
      ENCODING_QUEUE: encoding_queue
      TARGET_DIRECTORY: /app/storage/recordings/encoded
      TZ: Asia/Seoul
    volumes:
      - ./storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    restart: always
    ports:
      - 3000:3000
    environment:
      HOST: 127.0.0.1
      PORT: 3000
      RECORDING_SERVICE_HOST: host.docker.internal
      RECORDING_SERVICE_PORT: 3001
      STORAGE_SERVICE_HOST: 127.0.0.1
      STORAGE_SERVICE_PORT: 8333
      VIDEO_METADATA_SERVICE_BASE_URL: http://localhost:8080/api/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  mysql_data:
  seaweed_data:
  seaweed_admin_data: