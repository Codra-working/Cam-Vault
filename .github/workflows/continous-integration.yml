name: Continous integration
run-name: Continous integration
on:
  pull_request_target:
      branches: [main,develop]
  workflow_dispatch: 
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository}}
  
jobs:
    run-unit-test:
        name: Run ${{matrix.service}} unit test
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node-version: ${{fromJson(vars.NODE_VERSIONS)}}
                service: ${{fromJson(vars.SERVICES)}}

        defaults:
            run:
                working-directory: ./${{matrix.service}}

        steps:
        -   name: Checkout repository
            uses: actions/checkout@v4
            with:
                ref: ${{github.event.pull_request.head.sha}}

        -   name: Setup Node.js@v${{ matrix.node-version }} environment
            uses: actions/setup-node@v4
            with:
                node-version: ${{ matrix.node-version }}

        -   name: Install dependencies
            run: npm ci

        -   name: Install FFMPEG
            if: matrix.service == 'recording'||matrix.service == 'encoder'
            run: sudo apt-get update && sudo apt-get install -y ffmpeg

        -   name: Run unit tests
            run: npm test


    build-and-push-image:
        name: Build and push ${{matrix.service}} service
        runs-on: ubuntu-latest
        needs: run-unit-test
        permissions:
            id-token: write
            contents: read
            attestations: write
            packages: write
        strategy:
            fail-fast: false
            matrix:
                node-version: ${{fromJson(vars.NODE_VERSIONS)}}
                service: ${{fromJson(vars.SERVICES)}}
        defaults:
            run:
                working-directory: ./${{matrix.service}}        
        steps:
        -   name: Checkout repository
            uses: actions/checkout@v4
            with:
                ref: ${{github.event.pull_request.head.sha}}

        -   name: Log in to the Container registry
            uses: docker/login-action@v4.4.0
            with:
                registry: ${{env.REGISTRY}}
                username: ${{github.actor}}
                password: ${{secrets.GITHUB_TOKEN}}

        -   name: Extract metadata for Docker
            id: meta
            uses: docker/metadata-action@v6.2.0
            with:
                images: ${{env.REGISTRY}}/${{env.IMAGE_NAME}}/${{matrix.service}}

        -   name: Build and push Docker image
            id: push
            uses: docker/build-push-action@v7.3.0
            with:
                context: ./${{matrix.service}}
                push: true
                tags: ${{steps.meta.outputs.tags}}
                labels: ${{steps.meta.outputs.labels}}
                
        -   name: Generate artifact attestation
            uses: actions/attest@v4
            with:
                subject-name: ${{env.REGISTRY}}/${{env.IMAGE_NAME}}/${{matrix.service}}
                subject-digest: ${{steps.push.outputs.digest}}
                push-to-registry: true
