name: Increase the number of VERSION_BOTTOM
  
on:
  pull_request:
    branches: [main,develop]
env:
    GH_TOKEN: ${{ github.token }}
jobs:
  update-count-of-pull-request:
    runs-on: ubuntu-latest
    steps:
      - name: Increase and update the bottom number of version
        run: |
          count=${{vars.NEXT_VERSION_BOTTOM}}
          next=$(($count+1))
          gh variable set NEXT_VERSION_BOTTOM --body "$next" --repo Codra-working/Cam-Vault

        
          
        
