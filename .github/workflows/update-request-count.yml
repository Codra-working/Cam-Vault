name: Increase the number of VERSION_BOTTOM

on:
  pull_request:
    branches: [main,develop]

concurrency:
  group: update-next-version-bottom
  cancel-in-progress: false

jobs:
  update-next-version-bottom:
    runs-on: ubuntu-latest
    steps:
      - name: Increment NEXT_VERSION_BOTTOM
        run: |
          count=${{vars.NEXT_VERSION_BOTTOM}}
          next=$((count + 1))
          gh variable set NEXT_VERSION_BOTTOM --body "$next" --repo ${{github.repository}}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
