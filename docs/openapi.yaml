openapi: 3.1.0

info:
  title: Cam Vault Gateway API
  version: 0.0.1
  description: |
    Cam Vault 게이트웨이가 제공하는 Open API 명세입니다.
    현재 구현에서 문자열·숫자·boolean 단일 값 응답은 text/html로 직렬화됩니다.
    각 작업의 응답 Content-Type과 스키마를 확인해 처리해야 합니다.

servers:
  - url: http://3.37.27.72:8000
    description: Cam Vault 배포 서버

tags:
  - name: Authentication
    description: 로그인과 JWT 기반 사용자 정보 조회 API
  - name: Recording
    description: 녹화 서비스 상태, 녹화 설정, HLS 재생 목록, 플레이어 관련 API
  # Video metadata API is temporarily disabled.
#   - name: Video metadata
#     description: 비디오 메타데이터 서비스로 요청을 전달하는 프록시 API

paths:
  /auth/login:
    post:
      tags:
        - Authentication
      summary: 로그인 및 액세스 토큰 발급
      description: |
        사용자 이름과 비밀번호를 확인하고 유효 기간이 60초인 JWT를 발급합니다.
        발급받은 access_token을 프로필 조회 요청의 Authorization 헤더에
        Bearer 방식으로 전달합니다.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공 및 액세스 토큰
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/profile:
    get:
      tags:
        - Authentication
      summary: 로그인한 사용자 정보 조회
      description: |
        검증된 JWT의 페이로드를 반환합니다. 토큰이 없거나 유효하지 않거나
        만료된 경우 401을 반환합니다.
      operationId: getProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: JWT에 포함된 사용자 정보와 발급·만료 시각
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /recording/healthz:
    get:
      tags:
        - Recording
      summary: 녹화 서비스 응답 상태 확인
      description: 녹화 서비스가 상태 확인 요청에 응답하면 healthy를 반환합니다.
      operationId: getRecordingHealth
      responses:
        '200':
          description: 녹화 서비스가 응답함
          content:
            text/html:
              schema:
                type: string
                const: healthy
              example: healthy
        '500':
          $ref: '#/components/responses/InternalServerError'

  /recording/config:
    get:
      tags:
        - Recording
      summary: 전체 녹화 설정 조회
      operationId: getRecordingConfig
      responses:
        '200':
          description: 녹화 설정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingConfig'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /recording/config/rtsp/urls:
    get:
      tags:
        - Recording
      summary: RTSP URL 목록 조회
      operationId: listRtspUrls
      responses:
        '200':
          description: 설정된 RTSP URL 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uri
              example:
                - rtsp://camera.example.com/live/main
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Recording
      summary: RTSP URL 추가
      description: |
        RTSP URL을 녹화 설정에 추가하는 API입니다.
        현재 구현에는 입력한 URL 대신 문자열 [object Object]가 저장되고
        반환되는 문제가 있습니다.
      operationId: addRtspUrl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RtspUrlRequest'
      responses:
        '201':
          description: 현재 구현에서 저장·반환하는 문자열
          content:
            text/html:
              schema:
                type: string
              example: '[object Object]'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /recording/config/rtsp/urls/{id}:
    parameters:
      - $ref: '#/components/parameters/RtspUrlIndex'

    get:
      tags:
        - Recording
      summary: 개별 RTSP URL 조회
      description: RTSP URL 목록의 인덱스로 URL 하나를 조회합니다.
      operationId: getRtspUrl
      responses:
        '200':
          description: 해당 인덱스의 RTSP URL
          content:
            text/html:
              schema:
                type: string
                format: uri
              example: rtsp://camera.example.com/live/main
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Recording
      summary: RTSP URL 삭제
      description: |
        RTSP URL 목록의 인덱스로 URL을 삭제합니다. 해당 인덱스에 URL이 없으면
        응답 본문이 비어 있을 수 있습니다.
      operationId: deleteRtspUrl
      responses:
        '200':
          description: 삭제된 RTSP URL 또는 빈 응답 본문
          content:
            text/html:
              schema:
                type:
                  - string
                  - 'null'
                format: uri
              example: rtsp://camera.example.com/live/main
        '500':
          $ref: '#/components/responses/InternalServerError'

  /recording/config/segmentLength:
    get:
      tags:
        - Recording
      summary: 녹화 세그먼트 길이 조회
      operationId: getSegmentLength
      responses:
        '200':
          description: 세그먼트 길이(초)
          content:
            text/html:
              schema:
                type: string
                pattern: '^-?\d+$'
              example: '10'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Recording
      summary: 녹화 세그먼트 길이 변경
      description: |
        세그먼트 길이 변경 요청의 처리 결과를 문자열 true 또는 false로 반환합니다.
        현재 구현에서는 요청 본문의 segmentLength가 저장되지 않으므로,
        true 응답만으로 설정이 변경되었다고 판단할 수 없습니다.
      operationId: setSegmentLength
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SegmentLengthRequest'
      responses:
        '201':
          description: 변경 요청 처리 결과
          content:
            text/html:
              schema:
                type: string
                enum: ['true', 'false']
              example: 'true'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /recording/config/Bucket:
    get:
      tags:
        - Recording
      summary: 저장 경로 조회
      operationId: getStorageBucket
      responses:
        '200':
          description: 현재 저장 경로
          content:
            text/html:
              schema:
                type: string
              example: recordings
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Recording
      summary: 저장 경로 변경
      description: |
        Bucket은 현재 라우트와 요청 필드에서 실제로 사용하는 대소문자
        표기입니다.
        현재 구현에서는 요청 본문의 Bucket이 전달되지 않아 설정 변경이
        실패하고 500 응답이 발생할 수 있습니다.
      operationId: setStorageBucket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BucketRequest'
      responses:
        '201':
          description: 변경 요청 처리 결과
          content:
            text/html:
              schema:
                type: string
                enum: ['true', 'false']
              example: 'true'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /recording/config/rabbitmq/urls:
    get:
      tags:
        - Recording
      summary: RabbitMQ URL 조회
      operationId: getRabbitMqUrl
      responses:
        '200':
          description: 현재 RabbitMQ 접속 URL
          content:
            text/html:
              schema:
                type: string
                format: uri
              example: amqp://rabbitmq:5672
        '500':
          $ref: '#/components/responses/InternalServerError'

  /recording/video-catalog/{streamID}:
    parameters:
      - $ref: '#/components/parameters/StreamIndex'
      - name: start
        in: query
        required: true
        description: 조회 시작 시각입니다. RFC 3339 날짜·시간 형식 또는 문자열 0을 사용합니다.
        schema:
          $ref: '#/components/schemas/PlaybackTime'
        examples:
          relativeDefault:
            summary: 현재 시각에서 60초 전 사용
            value: '0'
          dateTime:
            summary: 지정한 시작 시각 사용
            value: '2026-08-11T00:00:00.000Z'
      - name: end
        in: query
        required: true
        description: 조회 종료 시각입니다. RFC 3339 날짜·시간 형식 또는 문자열 0을 사용합니다.
        schema:
          $ref: '#/components/schemas/PlaybackTime'
        examples:
          relativeDefault:
            summary: 현재 시각에서 60초 후 사용
            value: '0'
          dateTime:
            summary: 지정한 종료 시각 사용
            value: '2026-08-11T00:03:00.000Z'

    get:
      tags:
        - Recording
      summary: 스트림의 HLS 재생 목록 조회
      description: |
        지정한 시간 범위에 해당하는 녹화 세그먼트로 M3U8 재생 목록을 생성합니다.
        start에 문자열 0을 전달하면 현재 시각에서 60초 전을, end에 전달하면
        현재 시각에서 60초 후를 사용합니다.
        세그먼트 URL은 HTTP를 사용하며, 요청의 Host 헤더에 있는 호스트명과
        서버에 설정된 스토리지 공개 포트를 조합합니다.
        아래 응답 예시는 스토리지 공개 포트가 9000인 경우입니다.
        조회 결과가 없으면 세그먼트 항목 없이 미디어 시퀀스가 0인 재생 목록을 반환합니다.
      operationId: getVideoCatalog
      responses:
        '200':
          description: M3U8 형식의 HLS 재생 목록
          headers:
            Cache-Control:
              description: 응답을 캐시하지 않도록 지정합니다.
              schema:
                type: string
                const: no-cache
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
              example: |
                #EXTM3U
                #EXT-X-VERSION:3
                #EXT-X-TARGETDURATION:12
                #EXT-X-MEDIA-SEQUENCE:1
                #EXT-X-PLAYLIST-TYPE:EVENT
                #EXTINF:10,
                http://16.184.51.2:9000/recordings/segment-1.ts
        '400':
          description: |
            요청의 Host 헤더가 없습니다. 오류 본문은 JSON이지만 현재 구현에서는
            HLS Content-Type(application/vnd.apple.mpegurl)이 유지됩니다.
          content:
            application/vnd.apple.mpegurl:
              schema:
                $ref: '#/components/schemas/HttpError'
              example:
                statusCode: 400
                timestamp: '2026-10-17T00:00:00.000Z'
                path: /recording/video-catalog/0?start=0&end=0
        '500':
          $ref: '#/components/responses/InternalServerError'

  /recording/videos/{id}:
    parameters:
      - $ref: '#/components/parameters/RtspUrlIndex'
      - name: start
        in: query
        required: false
        description: |
          재생 시작 시각입니다. end와 함께 지정해야 적용됩니다.
          두 값 중 하나라도 없거나 비어 있으면 현재 시각에서 2분 전을 사용합니다.
          문자열 0을 지정하면 재생 목록 조회 시 현재 시각에서 60초 전을 사용합니다.
        schema:
          $ref: '#/components/schemas/PlaybackTime'
        example: '2026-10-17T00:00:00.000Z'
      - name: end
        in: query
        required: false
        description: |
          재생 종료 시각입니다. start와 함께 지정해야 적용됩니다.
          두 값 중 하나라도 없거나 비어 있으면 현재 시각에서 1분 후를 사용합니다.
          문자열 0을 지정하면 재생 목록 조회 시 현재 시각에서 60초 후를 사용합니다.
        schema:
          $ref: '#/components/schemas/PlaybackTime'
        example: '2026-10-17T00:03:00.000Z'

    get:
      tags:
        - Recording
      summary: HLS 테스트 플레이어 조회
      description: |
        지정한 스트림 인덱스에 해당하는 HLS 재생 목록을 재생하는 HTML 페이지를 반환합니다.
        start와 end가 모두 있으면 해당 시간 범위를 사용합니다.
        한 값이라도 없거나 비어 있으면 두 값을 모두 기본 범위
        (페이지 요청 시각의 2분 전부터 1분 후까지)로 설정합니다.
      operationId: getVideoPlayer
      responses:
        '200':
          description: HLS.js 플레이어가 포함된 HTML 문서
          content:
            text/html:
              schema:
                type: string
        '500':
          $ref: '#/components/responses/InternalServerError'

