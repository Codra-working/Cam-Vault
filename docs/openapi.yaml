    HttpError:
      type: object
      required:
        - statusCode
        - timestamp
        - path
      properties:
        statusCode:
          type: integer
          minimum: 400
          maximum: 599
          example: 401
        timestamp:
          type: string
          format: date-time
          example: '2026-10-17T00:00:00.000Z'
        path:
          type: string
          description: 오류가 발생한 요청 URL(쿼리 문자열 포함)
          example: /auth/profile

    InternalServerError:
      type: object
      required:
        - statusCode
        - message
      properties:
        statusCode:
          type: integer
          const: 500
          example: 500
        message:
          type: string
          example: Internal server error
        error:
          type: string
          example: Internal Server Error

  responses:
    Unauthorized:
      description: 로그인 정보가 올바르지 않거나 Bearer 토큰이 누락·만료·유효하지 않음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'
          example:
            statusCode: 401
            timestamp: '2026-10-17T00:00:00.000Z'
            path: /auth/profile

    InternalServerError:
      description: 게이트웨이 또는 하위 서비스의 요청 처리 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalServerError'
