services:
  recording:
    build:
      context: .
    restart: always
    command: sh -c "node --enable-source-maps dist/main"
    ports:
      - ${RECORDING_TCP_PORT:-3001}:3001
    environment:
      ### RecordingService ip options ###
      RECORDING_TCP_HOST: ${RECORDING_TCP_HOST:-0.0.0.0}
      RECORDING_TCP_PORT: ${RECORDING_TCP_PORT:-3001}

      ### RecordingService recording options ###
      RECORDING_STREAMS: ${RECORDING_STREAMS:-rtsp://210.99.70.120:1935/live/cctv001.stream}
      RECORDING_CRON: ${RECORDING_CRON:-* * * * *}
      RECORDING_SEGMENT_LENGTH: ${VIDEO_LENGTH:-30}
      RECORDING_TZ: ${RECORDING_TZ:-Asia/Seoul}

      ### DB options ###
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-recording_service}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-true}

      ### RMQ options ###
      RMQ_URL: ${RMQ_URL:-amqp://rabbitmq:5672}
      RMQ_QUEUE_NAME: ${RMQ_QUEUE_NAME:-encoding_queue}

      ### S3 storage options ###
      S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:8333}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-'true'}
      S3_USE_DUALSTACK_ENDPOINT: ${S3_USE_DUALSTACK_ENDPOINT:-'false'}
      S3_TARGET_DIR: ${S3_TARGET_DIR:-/app/storage/recordings}
      S3_RESPONSE_CHECKSUM_VALIDATION: ${S3_RESPONSE_CHECKSUM_VALIDATION:-WHEN_REQUIRED}
      S3_REQUEST_CHECKSUM_CALCULATION: ${S3_REQUEST_CHECKSUM_CALCULATION:-WHEN_REQUIRED}
      S3_CREDENTIALS_ACCESS_KEY_ID: ${S3_CREDENTIALS_ACCESS_KEY_ID:-admin}
      S3_CREDENTIALS_SECRET_ACCESS_KEY: ${S3_CREDENTIALS_SECRET_ACCESS_KEY:-secret}

    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      storage:
        condition: service_healthy
